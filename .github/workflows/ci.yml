name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ES2015 syntax gate (webOS 4 = Chromium 53)
        run: npm run check:syntax
      - run: npm test
      - name: Package .ipk
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: ipk
          path: dist/*.ipk
